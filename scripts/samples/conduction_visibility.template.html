<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--ink:var(--foreground,CanvasText);--muted-ink:var(--muted-foreground,GrayText);--paper:var(--card,Canvas);--edge:var(--border,ButtonBorder);--old:color-mix(in srgb,var(--chart-1,oklch(from var(--ink) clamp(.46,l,.8) .15 250)),var(--chart-5,oklch(from var(--ink) clamp(.46,l,.8) .15 310)) 55%);--new:color-mix(in oklab,var(--old) 65%,var(--ink) 35%);color-scheme:light dark}*{box-sizing:border-box}html,body{margin:0}body{font:13px/1.5 var(--font-sans,system-ui),sans-serif;color:var(--ink)}main{display:flex;flex-direction:column;gap:8px}.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sample{min-width:0;padding:16px;background:var(--paper);border:1px solid var(--edge);border-radius:var(--radius,10px)}.caption{margin:0 0 8px;font-size:12px;color:var(--muted-ink)}.row{display:grid;grid-template-columns:64px minmax(0,1fr) 44px;gap:6px;align-items:center;width:100%;height:34px;padding:0;border:0;background:none;color:var(--paint);cursor:pointer;font:600 12px var(--font-sans,system-ui),sans-serif;text-align:left}.row:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}.row[aria-pressed=false]{--paint:var(--muted-ink)!important}.label{white-space:nowrap}.value{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.new .row{font-weight:700}.plot{width:100%;height:30px;display:block;overflow:visible}.axis{stroke:var(--edge);stroke-width:1}.ref,.history{fill:none;stroke:var(--paint)}.ref{stroke-width:1;opacity:.2}.history{stroke-width:1.7}.new .ref{stroke-width:1.5;opacity:.7}.new .history{stroke-width:2.4}.dot{fill:var(--paint);stroke:var(--paper);stroke-width:1}.cursor{stroke:var(--muted-ink);stroke-width:.8;stroke-dasharray:2 3;opacity:.7}.plot path,.plot line{vector-effect:non-scaling-stroke}.ticks{display:flex;justify-content:space-between;margin:2px 50px 0 70px;font-size:10px;color:var(--muted-ink)}.note{margin:0;font-size:11px;color:var(--muted-ink)}@media(max-width:620px){.comparison{grid-template-columns:minmax(0,1fr)}}
</style></head><body><main><div class="comparison"><section class="sample"><p class="caption">Previous · sparse dots</p><button class="row" type="button" aria-label="Previous S1 voltage color" aria-pressed="true" style="--paint:var(--old)"><span class="label">vₛ₁ / Vₘ</span><svg class="plot" data-variant="old" viewBox="0 0 320 30" preserveAspectRatio="none" aria-hidden="true"></svg><span class="value">−0.87</span></button><div class="ticks" aria-hidden="true"><span>0°</span><span>180°</span><span>360°</span></div></section><section class="sample new"><p class="caption">Updated · brighter, thicker dash-dot</p><button class="row" type="button" aria-label="Updated S1 voltage color" aria-pressed="true" style="--paint:var(--new)"><span class="label">vₛ₁ / Vₘ</span><svg class="plot" data-variant="new" viewBox="0 0 320 30" preserveAspectRatio="none" aria-hidden="true"></svg><span class="value">−0.87</span></button><div class="ticks" aria-hidden="true"><span>0°</span><span>180°</span><span>360°</span></div></section></div><p class="note">Same signal, θ = 240°. Click a waveform to remove color only; values and positions stay.</p></main><script>
__MODEL_JS__
const NS='http://www.w3.org/2000/svg',angle=240,samples=[...Array.from({length:721},(_,i)=>i*.5),29.999999,179.999999,209.999999,359.999999].sort((a,b)=>a-b);
const node=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);parent.append(e);return e;};
for(const svg of document.querySelectorAll('.plot')){
 const name=svg.dataset.variant,defs=node('defs',{},svg),cp=node('clipPath',{id:'history-'+name},defs);node('rect',{x:5,y:0,width:310*angle/360,height:30},cp);
 node('line',{x1:5,x2:315,y1:15,y2:15,class:'axis'},svg);const d=samples.map((t,i)=>`${i?'L':'M'}${5+310*t/360},${15-atCycleAngle(t).vs1*10}`).join(' '),dash=name==='new'?'8 2 2 2':'2 3';
 node('path',{d,class:'ref','stroke-dasharray':dash},svg);node('path',{d,class:'history','stroke-dasharray':dash,'clip-path':'url(#history-'+name+')'},svg);
 const x=5+310*angle/360;node('line',{x1:x,x2:x,y1:1,y2:29,class:'cursor'},svg);node('circle',{cx:x,cy:15-atCycleAngle(angle).vs1*10,r:2.5,class:'dot'},svg);
 const button=svg.closest('button');button.querySelector('.value').textContent=atCycleAngle(angle).vs1.toFixed(2);button.addEventListener('click',()=>button.setAttribute('aria-pressed',button.getAttribute('aria-pressed')==='true'?'false':'true'));
}
</script></body></html>
