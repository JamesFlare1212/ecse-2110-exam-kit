name: CI
run-name: CI · ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to validate (for an existing PR: refs/pull/123/merge)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Use the same pinned Bun, without depending on GitHub Release downloads.
      - name: Install pinned Bun from npm
        run: |
          bun_version="$(node -e 'const match=/^bun@(\d+\.\d+\.\d+)$/.exec(require("./package.json").packageManager); if(!match) throw new Error("Pin a stable Bun version in packageManager"); process.stdout.write(match[1]);')"
          npm install --global "bun@$bun_version"
          test "$(bun --version)" = "$bun_version"
          bun --version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate authored Markdown and metadata with Bun
        run: bun run content:check
      - name: Check Astro and Svelte (native TypeScript 7)
        run: bun run check
      - name: Test content and geometry
        run: bun test
      - name: Build static app
        run: bun run build
      - name: Install isolated startup-test browser
        run: |
          mkdir -p "$RUNNER_TEMP/fieldnotes-browser"
          bun add --cwd "$RUNNER_TEMP/fieldnotes-browser" playwright@1.64.1
          bun "$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check cold reading, delayed fonts and font budgets
        run: |
          trap 'bun --bun astro preview stop' EXIT
          bun run preview --background
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-startup-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-course-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-reader-layout-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-reader-sections-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-conduction-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-conduction-compact-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-conduction-colors-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-full-converter-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-converter-navigation-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-page-links-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-course-citations-qa.mjs
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:4173 bun scripts/browser-content-typography-qa.mjs
      - name: Check lazy converter styles across development navigation
        run: |
          trap 'bun --bun astro dev stop' EXIT
          bun run dev --background
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/fieldnotes-browser/node_modules/playwright/index.mjs" \
            QA_URL=http://127.0.0.1:5173 QA_STYLE_ARTIFACTS=artifacts/converter-navigation-dev \
            bun scripts/browser-converter-navigation-qa.mjs
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-browser-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  figure-tools:
    name: Figure tools (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/fieldnotes-matplotlib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: scripts/requirements-figures.txt
      - name: Install figure-only dependencies
        run: python -m pip install -r scripts/requirements-figures.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Test native circuit rendering and circle geometry
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check both figure themes, circular symbols and annotation layout
        run: python scripts/check_figures.py
      - name: Upload figure diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: figure-review-python-${{ matrix.python }}
          path: artifacts/figure-review/
          if-no-files-found: ignore
          retention-days: 7
